name: Deploy Brothers site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "link-tube-store/**"
      - "street-fm-store/**"
      - "boa-guest-house/**"
      - "kunfre-enterprise/**"
      - "index.html"
      - "joker-di-genius-store/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          enable_jekyll: false
