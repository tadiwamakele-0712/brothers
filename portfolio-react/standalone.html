  <title>Tadiwa Makele — React Portfolio</title>
  <script>
    (function () {
      var path = location.pathname;
      var slash = path.lastIndexOf("/");
      var dir = slash >= 0 ? path.slice(0, slash + 1) : "/";
      var base = document.createElement("base");
      base.href = dir;
      document.head.appendChild(base);
    })();
  </script>
  <meta name="theme-color" content="#0066cc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="Tadiwa Makele — React Portfolio">

  <meta property="og:url" content="https://tadiwamakele-0712.github.io/brothers/portfolio-react/standalone.html">
  <link rel="stylesheet" href="src/App.css">
  <link rel="stylesheet" href="src/index.css">
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    #app-loading .loading-hint { font-size: 0.9rem; max-width: 320px; }
    #app-loading .loading-link { font-size: 0.85rem; }

<body>

    <p class="loading-hint">If this stays long, check internet (WiFi/data) and try again.</p>
    <p class="loading-link">

  </div>

    <p class="noscript-fallback">
      JavaScript is required. Open in Chrome or Safari:
      <a href="https://tadiwamakele-0712.github.io/brothers/portfolio-react/standalone.html">portfolio link</a>

  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
  <script>
    window.addEventListener("error", function () {
      var el = document.getElementById("app-loading");
      if (el) {
        el.classList.remove("hidden");
        el.innerHTML =
          "<p><strong>Could not load app</strong></p>" +
          "<p style='font-size:0.9rem'>Use WiFi/data, then tap:</p>" +
          "<p><a href='https://tadiwamakele-0712.github.io/brothers/portfolio-react/standalone.html'>Open portfolio link</a></p>";
      }
    });
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    const DRAFT_KEY = "portfolio-contact-draft";
    const THEME_KEY = "portfolio-theme";

    const LESSONS = [
      { num: 1, title: "HTML Basics", topic: "Structure & tags", link: "../my lesson/lesson-01-html/index.html" },
      { num: 2, title: "Semantic HTML", topic: "Forms & tables", link: "../my lesson/lesson-02-semantic/index.html" },
      { num: 3, title: "CSS Styling", topic: "Colors, layout, fonts", link: "../my lesson/lesson-03-css/index.html" },
      { num: 4, title: "JavaScript", topic: "Variables, functions, events", link: "../my lesson/lesson-04-javascript/index.html" },
      { num: 5, title: "Responsive Design", topic: "Media queries", link: "../index.html" },
      { num: 6, title: "Git & GitHub", topic: "Version control", link: "https://github.com/tadiwamakele-0712", external: true },
      { num: 7, title: "GitHub Pages", topic: "Deploy online", link: "../lessons.html" },
      { num: 8, title: "Todo App", topic: "localStorage project", link: "../my lesson/lesson-08-todo/todo.html" },
      { num: 9, title: "DOM + Calculator", topic: "Events & logic", link: "../my lesson/lesson-09-calculator/index.html" },
      { num: 10, title: "Fetch API", topic: "Weather App", link: "../portfolio/weather-app/index.html" },
      { num: 11, title: "Async/Await", topic: "Notes App", link: "../portfolio/tadie-app/index.html" },
      { num: 12, title: "HTML Portfolio", topic: "Final project", link: "../portfolio/index.html" },
      { num: 13, title: "React Intro", topic: "Components & props", link: "standalone.html" },
      { num: 14, title: "useState + Forms", topic: "Controlled inputs", link: "standalone.html#/contact" },
      { num: 15, title: "useEffect", topic: "Side effects & deploy", link: "standalone.html#/journey" },
      { num: 16, title: "Capstone", topic: "Polish & certificate", link: "certificate.html" },
      { num: 17, title: "React Router", topic: "Multiple pages, NavLink", link: "standalone.html#/projects" },
      { num: 18, title: "TypeScript", topic: "Types, interfaces, props", link: "typescript-demo.html" },
      { num: 19, title: "Node.js + Express", topic: "Backend API, REST", link: "../backend-api/public/index.html" },
      { num: 20, title: "React + API", topic: "Connect frontend to backend", link: "standalone.html#/about" },
      { num: 21, title: "Bonus: SQLite + Deploy", topic: "Database, admin, deploy", link: "../backend-api/public/lesson21.html" },
      { num: 22, title: "Capstone Project", topic: "Build your own app", link: "lesson22.html" },
      { num: 23, title: "Git Branches & PRs", topic: "Professional Git workflow", link: "lesson23.html" },
      { num: 24, title: "Web Accessibility", topic: "a11y, keyboard, alt text", link: "lesson24.html" },
      { num: 25, title: "Performance & SEO", topic: "Core Web Vitals, meta tags", link: "lesson25.html" },
    ];

    const API_BASE = (() => {
      const saved = localStorage.getItem("portfolio-api-url");
      if (saved) return saved.replace(/\/$/, "");
      const local =
        location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (local) return "http://localhost:3001/api";
      return "";
    })();

    function hideAppLoading() {
      const el = document.getElementById("app-loading");
      if (el) el.classList.add("hidden");
    }

    async function apiFetch(path, options) {
      if (!API_BASE) throw new Error("API not configured");
      const res = await fetch(`${API_BASE}${path}`, options);
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `API error ${res.status}`);
      }
      return res.json();
    }

    async function checkApiHealth() {
      try {
        await apiFetch("/health");
        return true;
      } catch {
        return false;
      }
    }

    async function fetchSkills() {
      const data = await apiFetch("/skills");
      return data.skills;
    }

    async function fetchApiProjects() {
      const data = await apiFetch("/projects");
      return data.projects;
    }

    async function fetchMessages() {
      const data = await apiFetch("/messages");
      return data.messages;
    }

    async function postContact(payload) {
      await apiFetch("/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }

    function ApiStatus() {
      const [online, setOnline] = useState(null);

      useEffect(() => {
        checkApiHealth().then(setOnline);
      }, []);

      if (online === null) return null;

      return (
        <p className={`api-status ${online ? "api-online" : "api-offline"}`}>
          {online
            ? "✓ API connected — data inouya kubva Express server (Lesson 20)"
            : "⚠ API offline — start: cd backend-api → npm start"}
        </p>
      );
    }

    function ApiMessages({ refreshKey }) {
      const [messages, setMessages] = useState([]);
      const [error, setError] = useState("");

      useEffect(() => {
        fetchMessages()
          .then(setMessages)
          .catch(() => setError("API haisi kushanda — run backend-api server."));
      }, [refreshKey]);

      if (error) return <p className="section-intro">{error}</p>;
      if (!messages.length) {
        return <p className="section-intro">Hapana messages parizvino — tumira imwe!</p>;
      }

      return (
        <ul className="api-messages">
          {messages.slice(0, 5).map((msg) => (
            <li key={msg.id}>
              <strong>{msg.name}</strong>: {msg.message}
              <span className="msg-meta">
                {msg.email} · {new Date(msg.date).toLocaleString()}
              </span>
            </li>
          ))}
        </ul>
      );
    }

    function ThemeToggle() {
      const [dark, setDark] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = saved === "dark";
        setDark(prefersDark);
        document.body.classList.toggle("dark", prefersDark);
      }, []);

      function toggleTheme() {
        const next = !dark;
        setDark(next);
        document.body.classList.toggle("dark", next);
        localStorage.setItem(THEME_KEY, next ? "dark" : "light");
      }

      return (
        <button
          type="button"
          className="theme-toggle"
          onClick={toggleTheme}
          aria-label="Toggle dark mode"
        >
          {dark ? "☀ Light" : "🌙 Dark"}
        </button>
      );
    }

    function ContactForm({ onSent }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [message, setMessage] = useState("");
      const [sent, setSent] = useState(false);
      const [lastName, setLastName] = useState("");
      const [draftSaved, setDraftSaved] = useState(false);
      const [viaApi, setViaApi] = useState(false);
      const [sending, setSending] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem(DRAFT_KEY);
        if (!saved) return;

        try {
          const draft = JSON.parse(saved);
          setName(draft.name || "");
          setEmail(draft.email || "");
          setMessage(draft.message || "");
        } catch {
          localStorage.removeItem(DRAFT_KEY);
        }
      }, []);

      useEffect(() => {
        if (sent) return;

        const timer = setTimeout(() => {
          localStorage.setItem(
            DRAFT_KEY,
            JSON.stringify({ name, email, message })
          );
          setDraftSaved(true);
        }, 400);

        return () => clearTimeout(timer);
      }, [name, email, message, sent]);

      async function handleSubmit(event) {
        event.preventDefault();

        if (!name.trim() || !email.trim() || !message.trim()) {
          alert("Zadza zvese — zita, email, uye message.");
          return;
        }

        setSending(true);
        let savedToApi = false;

        try {
          await postContact({
            name: name.trim(),
            email: email.trim(),
            message: message.trim(),
          });
          savedToApi = true;
        } catch {
          savedToApi = false;
        }

        setLastName(name.trim());
        setViaApi(savedToApi);
        setSent(true);
        setName("");
        setEmail("");
        setMessage("");
        localStorage.removeItem(DRAFT_KEY);
        setDraftSaved(false);
        setSending(false);
        onSent?.();
      }

      function resetForm() {
        setSent(false);
        setLastName("");
        setViaApi(false);
      }

      if (sent) {
        return (
          <div className="form-success">
            <p>
              Maita basa, <strong>{lastName}</strong>! Message yako yatambirwa
              {viaApi ? " uye yachengetwa pa Express API." : " (local mode — API offline)."}
            </p>
            <button type="button" className="btn-small" onClick={resetForm}>
              Tumira imwe message
            </button>
          </div>
        );
      }

      return (
        <form className="contact-form" onSubmit={handleSubmit}>
          <label>
            Zita
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Zita rako"
            />
          </label>
          <label>
            Email
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="email@example.com"
            />
          </label>
          <label>
            Message
            <textarea
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              placeholder="Nyora message yako pano..."
              rows={4}
            />
          </label>
          {draftSaved && (
            <p className="draft-hint">Draft yachengetwa mu browser</p>
          )}
          <button type="submit" className="btn-submit" disabled={sending}>
            {sending ? "Kutumira..." : "Tumira ku API"}
          </button>
        </form>
      );
    }

    function ScrollToTop() {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        function onScroll() {
          setVisible(window.scrollY > 300);
        }

        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      if (!visible) return null;

      return (
        <button
          type="button"
          className="scroll-top"
          onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          aria-label="Back to top"
        >
          ↑ Pamusoro
        </button>
      );
    }

    function ProfilePhoto({ name }) {
      const [failed, setFailed] = useState(false);
      const initials = name.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();

      if (failed) {
        return <div className="profile-photo profile-photo-fallback">{initials}</div>;
      }

      return (
        <img
          className="profile-photo"
          src="../portfolio/images/profile.jpg"
          alt={name}
          onError={() => setFailed(true)}
        />
      );
    }

    function ProjectCard({ title, description, link, tags }) {
      return (
        <article className="project-card">
          <h3>{title}</h3>
          <p>{description}</p>
          <div className="tags">
            {tags.map((tag) => (
              <span key={tag}>{tag}</span>
            ))}
          </div>
          <a href={link} className="project-link" target="_blank" rel="noreferrer">
            Vhura project →
          </a>
        </article>
      );
    }

    function App() {
      const name = "Tadiwa Makele";
      const [route, setRoute] = useState(() => {
        const hash = window.location.hash.slice(1);
        return hash || "/";
      });
      const [skills, setSkills] = useState([
        "HTML5", "CSS3", "JavaScript", "TypeScript", "React", "React Router",
        "Node.js", "Express", "DOM", "Fetch API", "localStorage", "Git & GitHub",
      ]);
      const [skillsFromApi, setSkillsFromApi] = useState(false);
      const [apiProjects, setApiProjects] = useState([]);
      const [projectsFromApi, setProjectsFromApi] = useState(false);
      const [messagesRefresh, setMessagesRefresh] = useState(0);

      function NavLink({ to, end, children }) {
        const isActive = end
          ? route === to || (route === "/" && to === "/")
          : route === to;
        return (
          <a href={`#${to}`} className={isActive ? "active" : ""}>
            {children}
          </a>
        );
      }

      useEffect(() => {
        document.title = `${name} — React Portfolio`;
      }, [name]);

      useEffect(() => {
        function onHashChange() {
          const hash = window.location.hash.slice(1) || "/";
          setRoute(hash);
          window.scrollTo(0, 0);
        }
        window.addEventListener("hashchange", onHashChange);
        if (!window.location.hash) window.location.hash = "#/";
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      useEffect(() => {
        fetchSkills()
          .then((data) => {
            setSkills(data);
            setSkillsFromApi(true);
          })
          .catch(() => setSkillsFromApi(false));
      }, []);

      useEffect(() => {
        fetchApiProjects()
          .then((data) => {
            setApiProjects(data);
            setProjectsFromApi(true);
          })
          .catch(() => setProjectsFromApi(false));
      }, []);

      const projects = [
        { title: "Todo App", description: "List yemabasa — wedzera, mark done, bvisa.", link: "../my lesson/lesson-08-todo/todo.html", tags: ["JavaScript", "localStorage"] },
        { title: "Calculator", description: "Calculator inoshanda — kuverenga ne DOM events.", link: "../my lesson/lesson-09-calculator/calculator/index.html", tags: ["HTML", "CSS Grid", "JavaScript"] },
        { title: "Weather App", description: "Tsvaga mamiriro ekosi neguta ne Fetch API.", link: "../portfolio/weather-app/index.html", tags: ["Fetch API", "async/await"] },
        { title: "Notes App", description: "Nyora notes, chengeta, bvisa.", link: "../portfolio/tadie-app/index.html", tags: ["localStorage", "JSON"] },
        { title: "Quiz App", description: "Quiz interactive.", link: "../my lesson/lesson-04-javascript/index.html", tags: ["HTML", "CSS"] },
        { title: "Shopping List", description: "List yezvinhu zvekutenga.", link: "../shopping-list-app/index.html", tags: ["JavaScript"] },
        { title: "Tae Gift Hampers", description: "Luxury gift hamper portfolio — gallery, lightbox, dark mode, WhatsApp.", link: "https://tadiwamakele-0712.github.io/tae-store/", tags: ["HTML", "CSS", "JavaScript", "GitHub Pages"] },
      ];

      function renderPage() {
        if (route === "/about") {
          return (
            <>
              <section className="section">
                <h2>Nezvangu</h2>
                <div className="about-layout">
                  <ProfilePhoto name={name} />
                  <div className="about-text">
                    <p>Ndiri mutambi we web development kubva muZimbabwe.</p>
                    <p>
                      Lesson 20: Skills zviri pasi zvinouya kubva{" "}
                      <strong>{skillsFromApi ? "Express API (GET /api/skills)" : "local fallback"}</strong>.
                    </p>
                    <a href="https://github.com/tadiwamakele-0712" target="_blank" rel="noreferrer">Ona kodhi yangu pa GitHub →</a>
                  </div>
                </div>
              </section>
              <section className="section">
                <h2>Skills {skillsFromApi && <span className="api-badge">from API</span>}</h2>
                <ul className="skills">{skills.map((s) => <li key={s}>{s}</li>)}</ul>
              </section>
            </>
          );
        }
        if (route === "/projects") {
          return (
            <>
              <section className="section">
                <h2>Projects Zvangu</h2>
                <p className="section-intro">Static projects (local links) + data kubva API kana server iri online.</p>
                <div className="project-grid">
                  {projects.map((p) => <ProjectCard key={p.title} {...p} />)}
                </div>
              </section>
              {projectsFromApi && (
                <section className="section">
                  <h2>From API <span className="api-badge">GET /api/projects</span></h2>
                  <div className="project-grid">
                    {apiProjects.map((project) => (
                      <article key={project.title} className="project-card">
                        <h3>{project.title}</h3>
                        <p>Project data kubva Express backend.</p>
                        <div className="tags">
                          {project.tags.map((tag) => (
                            <span key={tag}>{tag}</span>
                          ))}
                        </div>
                      </article>
                    ))}
                  </div>
                </section>
              )}
            </>
          );
        }
        if (route === "/journey") {
          return (
            <section className="section">
              <h2>Mufambiro Wangu — {LESSONS.length} Lessons</h2>
              <p className="section-intro"><a href="../lessons.html">→ Vhura full progress page</a></p>
              <div className="journey-grid">
                {LESSONS.map((lesson) => (
                  <a key={lesson.num} href={lesson.link} className="journey-item done"
                    target={lesson.external ? "_blank" : undefined} rel={lesson.external ? "noreferrer" : undefined}>
                    <span className="journey-num">{lesson.num}</span>
                    <div><strong>{lesson.title}</strong><span>{lesson.topic} — Vhura →</span></div>
                  </a>
                ))}
              </div>
              <div className="certificate-box">
                <h3>🎓 Makorokoto, {name}!</h3>
                <p>Wakapedza 21 lessons — HTML, CSS, JS, React, API, ne deploy!</p>
                <a href="certificate.html" className="btn-cert" target="_blank" rel="noreferrer">Vhura Certificate →</a>
              </div>
              <div className="section router-demo" style={{ marginTop: "24px" }}>
                <h3>Lesson 21 — Bonus</h3>
                <p className="section-intro">
                  <a href="../backend-api/public/lesson21.html">Deploy guide + admin panel →</a>
                  {" · "}
                  <a href="../backend-api/public/admin.html">Admin login →</a>
                </p>
              </div>
            </section>
          );
        }
        if (route === "/contact") {
          return (
            <section className="section">
              <h2>Contact</h2>
              <p className="section-intro">
                Form inotumira message ku <strong>POST /api/contact</strong> (Lesson 20).
              </p>
              <ContactForm onSent={() => setMessagesRefresh((k) => k + 1)} />
              <h3 style={{ marginTop: "28px", marginBottom: "12px", color: "var(--accent)" }}>
                Messages kubva API
              </h3>
              <ApiMessages refreshKey={messagesRefresh} />
              <ul className="contact-list">
                <li><strong>Email:</strong> <a href="mailto:tadiwamakele@gmail.com">tadiwamakele@gmail.com</a></li>
                <li><strong>Phone:</strong> <a href="tel:+263785092719">+263 785 092 719</a></li>
              </ul>
            </section>
          );
        }
        return (
          <>
            <section className="hero">
              <p className="hero-label">Lesson 24 — Accessibility</p>
              <h1>Mhoro, Ndini {name}</h1>
              <p>Sites zvinoshanda kune vanhu vese — keyboard, screen readers, contrast.</p>
              <div className="hero-links">
                <a href="lesson24.html" className="btn">Lesson 24 →</a>
                <a href="standalone.html#/contact" className="btn btn-outline">Test portfolio</a>
              </div>
            </section>
            <section className="section router-demo">
              <h2>Lesson 24: Web Accessibility</h2>
              <p className="section-intro">
                Semantic HTML, alt text, labels, keyboard focus, Lighthouse audit.
                <a href="lesson24.html"> Vhura Lesson 24 →</a>
              </p>
              <p className="section-intro">
                API URL: <code>{API_BASE}</code>
                {localStorage.getItem("portfolio-api-url") && (
                  <> · <a href="../backend-api/public/lesson21.html">Change live API URL</a></>
                )}
              </p>
            </section>
          </>
        );
      }

      return (
        <div className="app">
          <header className="header">
            <div className="logo">{name}</div>
            <div className="header-actions">
              <nav className="nav">
                <NavLink to="/" end>Home</NavLink>
                <NavLink to="/about">Nezvangu</NavLink>
                <NavLink to="/projects">Projects</NavLink>
                <NavLink to="/journey">Journey</NavLink>
                <NavLink to="/contact">Contact</NavLink>
                <a href="../lessons.html">My Lessons</a>
                <a href="../portfolio/index.html">HTML Portfolio</a>
              </nav>
              <ThemeToggle />
            </div>
          </header>

          <ApiStatus />

          {renderPage()}

          <ScrollToTop />

          <footer className="footer">
            <p>&copy; 2026 {name}. React Portfolio — Lesson 24: Accessibility.</p>
            <div className="footer-links">
              <a href="https://github.com/tadiwamakele-0712" target="_blank" rel="noreferrer">GitHub</a>
              <a href="../lessons.html">My Lessons</a>
              <a href="certificate.html">Certificate</a>
              <a href="../index.html">Brothers of Africa</a>
            </div>
          </footer>
        </div>
      );
    }

    try {
      const mount = document.getElementById("root");
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(mount).render(<App />);
      } else {
        ReactDOM.render(<App />, mount);
      }
      hideAppLoading();
    } catch (err) {
      console.error(err);
      const el = document.getElementById("app-loading");
      if (el) {
        el.classList.remove("hidden");
        el.innerHTML =
          "<p><strong>App failed to start</strong></p>" +
          "<p style='font-size:0.9rem'>Open in Chrome/Safari (not only WhatsApp preview):</p>" +
          "<p><a href='https://tadiwamakele-0712.github.io/brothers/portfolio-react/standalone.html'>portfolio link</a></p>";
      }
    }
  </script>
</body>
</html>
